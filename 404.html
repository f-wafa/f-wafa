    <title>404 — Page not found · Faiz.dev</title>
    <meta
      name="description"
      content="This page wandered off. Head back to Faiz.dev's portfolio to explore projects, skills, and contact details."
    />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0d1017" id="theme-color" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <script>
      (() => {
        const key = "fw-theme";
        let theme = null;
        try {
          theme = localStorage.getItem(key);
        } catch (_) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.classList.toggle("dark", theme === "dark");
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>

        </a>
      </div>

      <div class="mt-10 flex items-center justify-center gap-2">
        <button
          type="button"
          class="icon-btn"
          data-theme-toggle
          aria-label="Switch to light mode"
          aria-pressed="false"
        >
          <svg class="icon-moon size-[18px]" aria-hidden="true"><use href="#i-moon" /></svg>
          <svg class="icon-sun size-[18px]" aria-hidden="true"><use href="#i-sun" /></svg>
        </button>
        <a
          href="https://github.com/f-wafa"
          target="_blank"
          rel="noopener noreferrer"
          class="icon-btn"
          aria-label="GitHub"

          <svg class="size-[18px]" aria-hidden="true"><use href="#b-github" /></svg>
        </a>
        <a href="mailto:faizsyaifulwafa@gmail.com" class="icon-btn" aria-label="Email">
          <svg class="size-[18px]" aria-hidden="true"><use href="#b-gmail" /></svg>
        </a>
      </div>

      <p class="mt-8 font-mono text-[0.6rem] uppercase tracking-[0.2em] text-faint">
        © <span id="year">2026</span> Faiz Syaiful Wafa
