<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title">
  <title id="title">Tailwind UI Lab — abstract preview</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef6f3"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#0f172a" stroke-opacity=".05"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <circle cx="1050" cy="90" r="230" fill="#10b981" opacity=".09"/>
  <circle cx="120" cy="700" r="200" fill="#0d9488" opacity=".07"/>

  <!-- browser window -->
  <g transform="translate(120 80)">
    <rect width="960" height="590" rx="18" fill="#ffffff" stroke="#dbe3ea"/>
    <rect width="960" height="48" rx="18" fill="#f1f5f9"/>
    <rect y="30" width="960" height="18" fill="#f1f5f9"/>
    <circle cx="28" cy="24" r="6" fill="#cbd5e1"/>
    <circle cx="50" cy="24" r="6" fill="#cbd5e1"/>
    <circle cx="72" cy="24" r="6" fill="#cbd5e1"/>
    <rect x="300" y="14" width="360" height="20" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="480" y="28" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">tailwind-lab.dev / components</text>

    <!-- sidebar -->
    <rect y="48" width="200" height="542" fill="#f8fafc"/>
    <rect x="199" y="48" width="1" height="542" fill="#e2e8f0"/>
    <g transform="translate(26 80)">
      <rect width="32" height="32" rx="9" fill="url(#accent)"/>
      <path d="M8 19c3-7 6-7 9 0 3-7 6-7 9 0" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      <text x="44" y="15" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="700">UI Lab</text>
      <text x="44" y="29" fill="#94a3b8" font-family="monospace" font-size="8">tailwind components</text>
    </g>
    <g transform="translate(18 162)" font-family="monospace" font-size="10">
      <rect width="164" height="34" rx="8" fill="#0f766e" opacity=".1"/>
      <rect x="12" y="12" width="10" height="10" rx="2" fill="#0d9488"/>
      <text x="34" y="22" fill="#0f766e">Buttons</text>
      <g fill="#64748b">
        <rect x="12" y="48" width="10" height="10" rx="2" fill="#cbd5e1"/><text x="34" y="58">Inputs</text>
        <rect x="12" y="84" width="10" height="10" rx="2" fill="#cbd5e1"/><text x="34" y="94">Cards</text>
        <rect x="12" y="120" width="10" height="10" rx="2" fill="#cbd5e1"/><text x="34" y="130">Badges</text>
        <rect x="12" y="156" width="10" height="10" rx="2" fill="#cbd5e1"/><text x="34" y="166">Modals</text>
        <rect x="12" y="192" width="10" height="10" rx="2" fill="#cbd5e1"/><text x="34" y="202">Toggles</text>
      </g>
    </g>
    <g transform="translate(18 510)">
      <rect width="164" height="58" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
      <text x="14" y="22" fill="#047857" font-family="monospace" font-size="9" font-weight="700">A11Y CHECKED</text>
      <text x="14" y="40" fill="#059669" font-family="monospace" font-size="8">keyboard · focus · labels</text>
    </g>

    <!-- main -->
    <g transform="translate(228 80)">
      <text x="0" y="14" fill="#0f172a" font-family="sans-serif" font-size="21" font-weight="700">Buttons</text>
      <text x="0" y="36" fill="#64748b" font-family="monospace" font-size="10">copy-paste components with states and dark mode</text>
      <rect x="560" y="-2" width="140" height="30" rx="8" fill="#0f172a"/>
      <text x="630" y="17" text-anchor="middle" fill="#fff" font-family="monospace" font-size="9">Copy component</text>

      <!-- component showcase -->
      <g transform="translate(0 66)">
        <rect width="704" height="150" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="22" y="30" fill="#94a3b8" font-family="monospace" font-size="8">PRIMARY</text>
        <g transform="translate(22 46)">
          <rect width="126" height="38" rx="9" fill="url(#accent)"/>
          <text x="63" y="24" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11" font-weight="600">Get started</text>
          <rect x="140" width="126" height="38" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
          <text x="203" y="24" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="600">Secondary</text>
          <rect x="280" width="126" height="38" rx="9" fill="#0f172a"/>
          <text x="343" y="24" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11" font-weight="600">Dark</text>
          <rect x="420" width="126" height="38" rx="9" fill="#fee2e2"/>
          <text x="483" y="24" text-anchor="middle" fill="#b91c1c" font-family="sans-serif" font-size="11" font-weight="600">Danger</text>
          <rect x="560" width="120" height="38" rx="9" fill="none" stroke="#0d9488" stroke-dasharray="4 4"/>
          <text x="620" y="24" text-anchor="middle" fill="#0d9488" font-family="monospace" font-size="9">focus ring</text>
        </g>
        <g transform="translate(22 102)" font-family="monospace" font-size="8" fill="#94a3b8">
          <text>hover: -translate-y-0.5</text>
          <text x="170">focus-visible: ring-2</text>
          <text x="360">disabled: opacity-50</text>
          <text x="540">dark: bg-emerald-400</text>
        </g>
      </g>

      <!-- color + code -->
      <g transform="translate(0 238)">
        <rect width="336" height="190" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="22" y="30" fill="#0f172a" font-family="monospace" font-size="10" font-weight="700">Palette</text>
        <g transform="translate(22 48)">
          <rect width="292" height="42" rx="8" fill="#ecfdf5"/><text x="12" y="26" fill="#047857" font-family="monospace" font-size="9">emerald-50</text>
          <rect y="50" width="292" height="42" rx="8" fill="#10b981"/><text x="12" y="76" fill="#fff" font-family="monospace" font-size="9">emerald-500</text>
          <rect y="100" width="292" height="42" rx="8" fill="#0f766e"/><text x="12" y="126" fill="#fff" font-family="monospace" font-size="9">teal-700</text>
        </g>
      </g>
      <g transform="translate(354 238)">
        <rect width="350" height="190" rx="12" fill="#0b1220" stroke="#1e293b"/>
        <text x="20" y="28" fill="#64748b" font-family="monospace" font-size="8">COMPONENT.TSX</text>
        <g font-family="monospace" font-size="10">
          <text x="20" y="58" fill="#7dd3fc">export function</text>
          <text x="150" y="58" fill="#c4b5fd">Button</text>
          <text x="212" y="58" fill="#94a3b8">({"{"}</text>
          <text x="20" y="78" fill="#94a3b8">  variant</text>
          <text x="98" y="78" fill="#94a3b8">=</text>
          <text x="112" y="78" fill="#6ee7b7">"primary"</text>
          <text x="200" y="78" fill="#94a3b8">{"}"}) {"{"}</text>
          <text x="20" y="104" fill="#7dd3fc">  return</text>
          <text x="84" y="104" fill="#fda4af">&lt;button</text>
          <text x="20" y="124" fill="#94a3b8">    className</text>
          <text x="122" y="124" fill="#94a3b8">=</text>
          <text x="136" y="124" fill="#6ee7b7">"rounded-xl ..."</text>
          <text x="20" y="144" fill="#fda4af">  /&gt;</text>
          <text x="20" y="168" fill="#94a3b8">{"}"}</text>
        </g>
      </g>

      <!-- toggle row -->
      <g transform="translate(0 448)">
        <rect width="704" height="64" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="22" y="27" fill="#0f172a" font-family="monospace" font-size="9" font-weight="700">Dark mode</text>
        <text x="22" y="44" fill="#94a3b8" font-family="monospace" font-size="8">class-based · prefers-color-scheme</text>
        <rect x="610" y="18" width="56" height="28" rx="14" fill="#10b981"/>
        <circle cx="652" cy="32" r="10" fill="#fff"/>
        <text x="560" y="37" text-anchor="end" fill="#64748b" font-family="monospace" font-size="8">ON</text>
      </g>
    </g>
  </g>
</svg>
